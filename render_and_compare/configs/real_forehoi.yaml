# Robust single-env REAL config for this machine (RTX 4090, sm_89).
# Everything runs in the `forehoi` conda env (torch 2.5.1+cu121) which already
# holds MoGe, SAM2, ultralytics, HaMeR deps, chumpy, pytorch3d, kaolin and the
# sam3d_objects fork (MV_SAM3D). No second env needed: sam3d_env == forehoi.
#
#   conda run -n forehoi python -m hoi_recon.cli --video examples/wild6_trim.mp4 \
#       --out runs/wild6_real --real --config configs/real_forehoi.yaml
#
# Real backends: MoGe-2 depth, WiLoR YOLO hand boxes, SAM2 object seg,
# HaMeR->MANO hand, SAM-3D-Objects textured mesh (fails soft to depth-lift hull),
# in-process silhouette object-rotation tracker, numpy joint hand+object grasp
# optimization. Avoids the heavy differentiable PyTorch3D subprocess so it is
# robust end-to-end on a shared GPU.
mock: false

backend:
  hand: hamer            # HaMeR -> MANO (metric depth-anchored)
  object: sam3d          # SAM-3D-Objects textured mesh (fail-soft depth-lift)
  depth: moge            # MoGe-v2 metric depth + intrinsics
  object_pose: silhouette  # in-process rotation tracker (no subprocess)
  camera: identity       # static-camera assumption (no VIPE)
  sam3d_env: forehoi     # SAM-3D subprocess runs in the forehoi env

optim:
  differentiable: false  # numpy rigid joint hand+object grasp (in-process, robust)
  iters: 200
  lr: 0.02
  w_contact: 1.0
  w_pen: 0.3
  w_temporal: 0.2
  w_anchor: 0.02

contact:
  dist_thresh_m: 0.02
  normal_thresh_deg: 60.0
  knn_k: 50

smoothing:
  window: 5
